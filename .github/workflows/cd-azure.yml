name: CD Azure Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-azure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build React production bundle
        run: |
          npm install
          npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Azure Container Instance to pull and build latest main
        run: |
          echo "Reiniciando contenedor bustrack-landing en Azure (rg-bustrack-ncus)..."
          az container restart --resource-group rg-bustrack-ncus --name bustrack-landing

      - name: Smoke Test & Health Check Probe
        run: |
          LANDING_URL="http://bustrack-landing-uttt.northcentralus.azurecontainer.io:8000"
          echo "Verificando disponibilidad de la Landing en $LANDING_URL..."
          MAX_RETRIES=15
          DELAY=5
          HEALTHY=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Intento $i/$MAX_RETRIES: Consultando $LANDING_URL..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$LANDING_URL" || echo "000")
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "✅ Landing page respondió con 200 OK!"
              HEALTHY=1
              break
            fi
            echo "El contenedor aún está iniciando (código HTTP $STATUS_CODE). Esperando ${DELAY}s..."
            sleep $DELAY
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Error: La landing page no respondió 200 OK tras $((MAX_RETRIES * DELAY)) segundos."
            exit 1
          fi

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Resumen de Despliegue de Landing Page en Azure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Propiedad | Detalle |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Estado** | 🟢 Exitoso |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resource Group** | \`rg-bustrack-ncus\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Contenedor** | \`bustrack-landing\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Región** | North Central US |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL Pública** | [bustrack-landing-uttt](http://bustrack-landing-uttt.northcentralus.azurecontainer.io:8000) |" >> $GITHUB_STEP_SUMMARY
