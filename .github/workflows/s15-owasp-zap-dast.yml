name: Sec 15. DAST en Vivo (OWASP ZAP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bustrack-landing:zap -f Dockerfile .
      - run: docker run -d --name zap-target -p 8080:8080 bustrack-landing:zap
      - run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 2
          done
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:8080'
          fail_action: false
