name: CI PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml
