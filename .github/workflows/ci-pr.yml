name: CI PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WebSDD.slnx
      - name: Build
        run: dotnet build WebSDD.slnx -c Release --no-restore
      - name: Test
        run: dotnet test WebSDD.slnx -c Release --no-build
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml
