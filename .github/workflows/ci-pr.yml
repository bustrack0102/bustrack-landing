name: CI PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Validación SDD
        run: pwsh -File scripts/check_sdd.ps1
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml
